name: aur

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - PKGBUILD
      - .github/workflows/aur.yaml

env:
  AUR_PKG: sioyek-dev

jobs:
  publish:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git openssh

      - uses: actions/checkout@v4

      - name: Generate .SRCINFO
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO
          test -s .SRCINFO

      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org > ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          msg="$(git -c safe.directory='*' log -1 --format=%s)"
          git clone "ssh://aur@aur.archlinux.org/$AUR_PKG.git" /tmp/aur
          cp PKGBUILD .SRCINFO /tmp/aur/
          cd /tmp/aur
          git config user.name "Dhruva Sambrani"
          git config user.email "44899822+DhruvaSambrani@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || { git commit -m "$msg"; git push; }
